<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>حاسبة المعدل | توجيهي الأردن</title>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700;900&display=swap" rel="stylesheet">
<style>
  *{margin:0;padding:0;box-sizing:border-box;font-family:'Tajawal',sans-serif}
  :root{--bg-deep:#08060f;--bg-card:rgba(255,255,255,0.04);--gold:#d4af37;--gold-light:#f4d03f;--purple:#8b5cf6;--purple-deep:#6d28d9;--pink:#ec4899;--border:rgba(212,175,55,0.2);--text:#f5f5f7;--text-dim:#a1a1aa;--success:#22c55e;--error:#ef4444;--warning:#f59e0b}
  body{background:var(--bg-deep);color:var(--text);min-height:100vh;position:relative}
  .aura-bg{position:fixed;top:0;left:0;width:100%;height:100%;z-index:-2;overflow:hidden;pointer-events:none}
  .aura{position:absolute;border-radius:50%;filter:blur(80px);opacity:0.4;animation:auraFloat 20s ease-in-out infinite}
  .aura-1{width:500px;height:500px;background:radial-gradient(circle,#8b5cf6,transparent 70%);top:-10%;right:-10%}
  .aura-2{width:600px;height:600px;background:radial-gradient(circle,#d4af37,transparent 70%);bottom:-15%;left:-15%;animation-delay:-7s}
  @keyframes auraFloat{0%,100%{transform:translate(0,0) scale(1)}33%{transform:translate(50px,-50px) scale(1.1)}66%{transform:translate(-30px,30px) scale(0.9)}}
  .stars{position:fixed;top:0;left:0;width:100%;height:100%;z-index:-1;pointer-events:none}
  .star{position:absolute;width:2px;height:2px;background:#fff;border-radius:50%;animation:twinkle 3s infinite}
  @keyframes twinkle{0%,100%{opacity:0.2;transform:scale(1)}50%{opacity:1;transform:scale(1.5)}}
  nav{position:fixed;top:0;width:100%;padding:14px 20px;display:flex;justify-content:space-between;align-items:center;background:rgba(8,6,15,0.85);backdrop-filter:blur(20px);border-bottom:1px solid rgba(212,175,55,0.15);z-index:100}
  .logo{font-size:1.2rem;font-weight:900;background:linear-gradient(135deg,var(--gold),var(--gold-light),#fff,var(--gold));background-size:200% 200%;-webkit-background-clip:text;-webkit-text-fill-color:transparent;animation:shineText 4s linear infinite}
  @keyframes shineText{0%{background-position:0% 50%}100%{background-position:200% 50%}}
  .back-btn{color:var(--text);text-decoration:none;font-weight:700;padding:8px 16px;border-radius:25px;background:var(--bg-card);border:1px solid var(--border);transition:all 0.3s;font-size:0.9rem}
  .back-btn:hover{color:var(--gold);border-color:var(--gold)}
  .header{padding:110px 20px 20px;text-align:center}
  .header h1{font-size:2rem;font-weight:900;background:linear-gradient(135deg,#fff,var(--gold-light),var(--gold));-webkit-background-clip:text;-webkit-text-fill-color:transparent;margin-bottom:10px}
  .header p{color:var(--text-dim);font-size:1rem}
  .section{padding:20px;max-width:700px;margin:auto}
  
  .result-box{background:linear-gradient(135deg,rgba(212,175,55,0.2),rgba(139,92,246,0.2));border:2px solid rgba(212,175,55,0.5);border-radius:30px;padding:35px 20px;text-align:center;margin-bottom:25px;position:relative;overflow:hidden;box-shadow:0 20px 60px rgba(212,175,55,0.25)}
  .result-box::before{content:'';position:absolute;top:-50%;left:-50%;width:200%;height:200%;background:conic-gradient(from 0deg,transparent,rgba(212,175,55,0.2),transparent 30%);animation:rotateConic 10s linear infinite;pointer-events:none}
  @keyframes rotateConic{to{transform:rotate(360deg)}}
  .result-box > *{position:relative;z-index:1}
  .result-label{color:var(--gold);font-weight:700;font-size:1rem;margin-bottom:15px}
  .result-number{font-size:5rem;font-weight:900;line-height:1;background:linear-gradient(135deg,#fff,var(--gold-light),var(--gold));background-size:200% 200%;-webkit-background-clip:text;-webkit-text-fill-color:transparent;animation:shineText 3s linear infinite;margin-bottom:10px}
  .result-number.warn{background:linear-gradient(135deg,#fff,var(--warning),#d97706);-webkit-background-clip:text;background-clip:text}
  .result-number.fail{background:linear-gradient(135deg,#fff,var(--error),#b91c1c);-webkit-background-clip:text;background-clip:text}
  .result-grade{color:#fff;font-weight:900;font-size:1.4rem;margin-bottom:8px}
  .result-text{color:var(--text-dim);font-size:0.9rem;line-height:1.6}
  
  .info-card{background:linear-gradient(135deg,rgba(255,255,255,0.05),rgba(255,255,255,0.02));border:1px solid rgba(255,255,255,0.08);border-radius:22px;padding:22px;margin-bottom:20px;backdrop-filter:blur(10px)}
  .info-card h3{color:var(--gold);font-size:1.1rem;font-weight:900;margin-bottom:18px;display:flex;align-items:center;gap:8px}
  
  .subject-row{display:grid;grid-template-columns:1fr 90px 90px 40px;gap:10px;margin-bottom:12px;align-items:center;padding:10px;background:rgba(255,255,255,0.02);border-radius:15px;transition:all 0.3s}
  .subject-row:hover{background:rgba(255,255,255,0.04)}
  .subject-row input{width:100%;padding:12px;background:rgba(255,255,255,0.05);border:1px solid rgba(212,175,55,0.25);border-radius:12px;color:#fff;font-family:'Tajawal';font-size:0.9rem;outline:none;transition:all 0.3s;text-align:center}
  .subject-row input:focus{border-color:var(--gold);box-shadow:0 0 15px rgba(212,175,55,0.2)}
  .subject-row input[type="text"]{text-align:right}
  .subject-row .delete-btn{background:rgba(220,38,38,0.2);border:1px solid rgba(220,38,38,0.4);color:#fff;width:36px;height:36px;border-radius:10px;cursor:pointer;font-size:1rem;transition:all 0.3s}
  .subject-row .delete-btn:hover{background:#dc2626;transform:scale(1.1)}
  
  .row-header{display:grid;grid-template-columns:1fr 90px 90px 40px;gap:10px;margin-bottom:12px;padding:0 10px;color:var(--gold);font-weight:700;font-size:0.85rem;text-align:center}
  .row-header span:first-child{text-align:right}
  
  .btn{display:block;width:100%;padding:16px;border:none;border-radius:50px;font-family:'Tajawal';font-weight:900;font-size:1rem;cursor:pointer;transition:all 0.4s cubic-bezier(0.175,0.885,0.32,1.275);text-align:center;margin-bottom:12px}
  .btn-primary{background:linear-gradient(135deg,var(--gold),var(--gold-light));color:#1a1a1a;box-shadow:0 10px 30px rgba(212,175,55,0.4)}
  .btn-primary:hover{transform:translateY(-3px);box-shadow:0 15px 40px rgba(212,175,55,0.6)}
  .btn-secondary{background:rgba(139,92,246,0.2);color:#fff;border:1px solid var(--purple)}
  .btn-secondary:hover{background:rgba(139,92,246,0.3);transform:translateY(-3px)}
  .btn-danger{background:rgba(220,38,38,0.2);color:#fff;border:1px solid rgba(220,38,38,0.4)}
  .btn-danger:hover{background:#dc2626;transform:translateY(-3px)}
  
  .grade-scale{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin-top:15px}
  .grade-item{display:flex;justify-content:space-between;padding:10px 15px;background:rgba(255,255,255,0.03);border-radius:12px;font-size:0.85rem}
  .grade-item span:first-child{color:var(--text-dim)}
  .grade-item span:last-child{color:#fff;font-weight:700}
  
  @media(max-width:768px){
    .result-number{font-size:3.5rem}
    .subject-row{grid-template-columns:1fr 70px 70px 36px;gap:6px;padding:8px}
    .row-header{grid-template-columns:1fr 70px 70px 36px;gap:6px;font-size:0.75rem}
    .subject-row input{padding:10px 6px;font-size:0.85rem}
  }
</style>
</head>
<body>

<div class="aura-bg">
  <div class="aura aura-1"></div>
  <div class="aura aura-2"></div>
</div>

<div class="stars" id="stars"></div>

<nav>
  <div class="logo">🧮 حاسبة المعدل</div>
  <a href="index.html" class="back-btn">🏠 الرئيسية</a>
</nav>

<div class="header">
  <h1>حاسبة المعدل التراكمي</h1>
  <p>أدخل علاماتك واحسب معدلك مباشرة</p>
</div>

<div class="section">

  <div class="result-box">
    <div class="result-label">📊 معدلك التراكمي</div>
    <div class="result-number" id="resultNumber">0.00</div>
    <div class="result-grade" id="resultGrade">—</div>
    <div class="result-text" id="resultText">أضف موادك لحساب المعدل</div>
  </div>

  <div class="info-card">
    <h3>📚 المواد</h3>
    <div class="row-header">
      <span>المادة</span>
      <span>العلامة</span>
      <span>الوزن</span>
      <span></span>
    </div>
    <div id="subjectsList"></div>
    <button class="btn btn-secondary" onclick="addSubject()">➕ إضافة مادة</button>
  </div>

  <button class="btn btn-primary" onclick="calculate()">🧮 احسب المعدل</button>
  <button class="btn btn-danger" onclick="resetAll()">🗑️ حذف كل المواد</button>

  <div class="info-card">
    <h3>📏 سلم التقديرات</h3>
    <div class="grade-scale">
      <div class="grade-item"><span>90-100</span><span>ممتاز</span></div>
      <div class="grade-item"><span>80-89</span><span>جيد جداً</span></div>
      <div class="grade-item"><span>70-79</span><span>جيد</span></div>
      <div class="grade-item"><span>60-69</span><span>مقبول</span></div>
      <div class="grade-item"><span>50-59</span><span>ضعيف</span></div>
      <div class="grade-item"><span>0-49</span><span>راسب</span></div>
    </div>
  </div>

</div>

<script>
  const starsContainer = document.getElementById('stars');
  for (let i = 0; i < 50; i++) {
    const star = document.createElement('div');
    star.className = 'star';
    star.style.top = Math.random() * 100 + '%';
    star.style.left = Math.random() * 100 + '%';
    star.style.animationDelay = Math.random() * 3 + 's';
    star.style.animationDuration = (2 + Math.random() * 2) + 's';
    starsContainer.appendChild(star);
  }

  let subjects = JSON.parse(localStorage.getItem('tawjihi_subjects') || '[]');

  if (subjects.length === 0) {
    subjects = [
      { id: 's_' + Date.now() + '_1', name: 'اللغة العربية', grade: '', weight: '1' },
      { id: 's_' + Date.now() + '_2', name: 'اللغة الإنجليزية', grade: '', weight: '1' },
      { id: 's_' + Date.now() + '_3', name: 'الرياضيات', grade: '', weight: '1' }
    ];
  }

  function renderSubjects() {
    const list = document.getElementById('subjectsList');
    list.innerHTML = subjects.map(s => `
      <div class="subject-row">
        <input type="text" value="${s.name}" placeholder="اسم المادة" onchange="updateSubject('${s.id}', 'name', this.value)">
        <input type="number" value="${s.grade}" placeholder="0-100" min="0" max="100" onchange="updateSubject('${s.id}', 'grade', this.value)">
        <input type="number" value="${s.weight}" placeholder="1" min="0.5" step="0.5" onchange="updateSubject('${s.id}', 'weight', this.value)">
        <button class="delete-btn" onclick="deleteSubject('${s.id}')">✕</button>
      </div>
    `).join('');
  }

  function addSubject() {
    subjects.push({
      id: 's_' + Date.now(),
      name: '',
      grade: '',
      weight: '1'
    });
    saveAndRender();
  }

  function deleteSubject(id) {
    subjects = subjects.filter(s => s.id !== id);
    saveAndRender();
    calculate();
  }

  function updateSubject(id, field, value) {
    const subject = subjects.find(s => s.id === id);
    if (subject) {
      subject[field] = value;
      saveAndRender();
    }
  }

  function saveAndRender() {
    localStorage.setItem('tawjihi_subjects', JSON.stringify(subjects));
    renderSubjects();
  }

  function calculate() {
    let totalWeightedGrade = 0;
    let totalWeight = 0;
    let hasValidGrades = false;

    subjects.forEach(s => {
      const grade = parseFloat(s.grade);
      const weight = parseFloat(s.weight) || 1;
      if (!isNaN(grade) && grade >= 0 && grade <= 100) {
        totalWeightedGrade += grade * weight;
        totalWeight += weight;
        hasValidGrades = true;
      }
    });

    const resultNumber = document.getElementById('resultNumber');
    const resultGrade = document.getElementById('resultGrade');
    const resultText = document.getElementById('resultText');

    if (!hasValidGrades) {
      resultNumber.textContent = '0.00';
      resultNumber.className = 'result-number';
      resultGrade.textContent = '—';
      resultText.textContent = 'أضف علاماتك لحساب المعدل';
      return;
    }

    const avg = totalWeightedGrade / totalWeight;
    resultNumber.textContent = avg.toFixed(2);
    resultNumber.className = 'result-number';

    let grade = '';
    let text = '';
    if (avg >= 90) {
      grade = '🌟 ممتاز';
      text = 'أداء رائع! استمر في هذا المستوى';
    } else if (avg >= 80) {
      grade = '⭐ جيد جداً';
      text = 'ممتاز! أنت على الطريق الصحيح';
      resultNumber.classList.add('warn');
    } else if (avg >= 70) {
      grade = '👍 جيد';
      text = 'جيد، يمكنك التحسين أكثر';
      resultNumber.classList.add('warn');
    } else if (avg >= 60) {
      grade = '📖 مقبول';
      text = 'تحتاج مزيداً من الجهد';
      resultNumber.classList.add('warn');
    } else if (avg >= 50) {
      grade = '⚠️ ضعيف';
      text = 'يجب أن تركز أكثر على الدراسة';
      resultNumber.classList.add('fail');
    } else {
      grade = '❌ راسب';
      text = 'تحتاج إلى تحسين عاجل';
      resultNumber.classList.add('fail');
    }

    resultGrade.textContent = grade;
    resultText.textContent = text;
  }

  function resetAll() {
    if (!confirm('هل تريد حذف كل المواد؟')) return;
    subjects = [
      { id: 's_' + Date.now() + '_1', name: 'اللغة العربية', grade: '', weight: '1' },
      { id: 's_' + Date.now() + '_2', name: 'اللغة الإنجليزية', grade: '', weight: '1' },
      { id: 's_' + Date.now() + '_3', name: 'الرياضيات', grade: '', weight: '1' }
    ];
    saveAndRender();
    calculate();
  }

  renderSubjects();
  calculate();
</script>

</body>
</html>
