<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>تسجيل الدخول | توجيهي الأردن</title>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700;900&display=swap" rel="stylesheet">
<style>
  *{margin:0;padding:0;box-sizing:border-box;font-family:'Tajawal',sans-serif}
  :root{
    --bg-deep:#08060f;
    --bg-card:rgba(255,255,255,0.04);
    --gold:#d4af37;
    --gold-light:#f4d03f;
    --purple:#8b5cf6;
    --purple-deep:#6d28d9;
    --pink:#ec4899;
    --border:rgba(212,175,55,0.2);
    --text:#f5f5f7;
    --text-dim:#a1a1aa;
    --error:#ef4444;
    --success:#22c55e;
  }
  
  body{
    background:var(--bg-deep);
    color:var(--text);
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:20px;
    overflow:hidden;
    position:relative;
  }
  
  /* خلفية أورا */
  .aura-bg{
    position:fixed;top:0;left:0;width:100%;height:100%;
    z-index:-2;overflow:hidden;pointer-events:none;
  }
  .aura{
    position:absolute;border-radius:50%;
    filter:blur(80px);opacity:0.4;
    animation:auraFloat 20s ease-in-out infinite;
  }
  .aura-1{width:500px;height:500px;background:radial-gradient(circle,#8b5cf6,transparent 70%);top:-10%;right:-10%}
  .aura-2{width:600px;height:600px;background:radial-gradient(circle,#d4af37,transparent 70%);bottom:-15%;left:-15%;animation-delay:-7s}
  @keyframes auraFloat{0%,100%{transform:translate(0,0) scale(1)}33%{transform:translate(50px,-50px) scale(1.1)}66%{transform:translate(-30px,30px) scale(0.9)}}
  
  /* نجوم */
  .stars{position:fixed;top:0;left:0;width:100%;height:100%;z-index:-1;pointer-events:none}
  .star{position:absolute;width:2px;height:2px;background:#fff;border-radius:50%;animation:twinkle 3s infinite}
  @keyframes twinkle{0%,100%{opacity:0.2;transform:scale(1)}50%{opacity:1;transform:scale(1.5)}}
  
  /* البطاقة الرئيسية */
  .login-container{
    width:100%;
    max-width:440px;
    background:linear-gradient(135deg,rgba(255,255,255,0.05),rgba(255,255,255,0.02));
    border:1px solid rgba(212,175,55,0.25);
    border-radius:30px;
    padding:40px 30px;
    backdrop-filter:blur(20px);
    -webkit-backdrop-filter:blur(20px);
    box-shadow:0 30px 80px rgba(0,0,0,0.6), 0 0 80px rgba(212,175,55,0.1);
    position:relative;
    overflow:hidden;
    animation:cardEntry 0.8s cubic-bezier(0.175,0.885,0.32,1.275);
  }
  @keyframes cardEntry{
    from{opacity:0; transform:translateY(40px) scale(0.95)}
    to{opacity:1; transform:translateY(0) scale(1)}
  }
  .login-container::before{
    content:'';position:absolute;top:-50%;left:-50%;
    width:200%;height:200%;
    background:conic-gradient(from 0deg,transparent,rgba(212,175,55,0.15),transparent 30%);
    animation:rotateConic 10s linear infinite;
    pointer-events:none;
  }
  @keyframes rotateConic{to{transform:rotate(360deg)}}
  .login-container > *{position:relative; z-index:1}
  
  /* الشعار */
  .logo-area{
    text-align:center;
    margin-bottom:30px;
  }
  .logo-icon{
    font-size:4rem;
    display:block;
    margin-bottom:15px;
    animation:floatIcon 4s ease-in-out infinite;
    filter:drop-shadow(0 0 25px rgba(212,175,55,0.6));
  }
  @keyframes floatIcon{
    0%,100%{transform:translateY(0)}
    50%{transform:translateY(-12px)}
  }
  .logo-area h1{
    font-size:1.8rem;
    font-weight:900;
    background:linear-gradient(135deg,#fff,var(--gold-light),var(--gold));
    background-size:200% 200%;
    -webkit-background-clip:text;
    -webkit-text-fill-color:transparent;
    animation:shineText 4s linear infinite;
    margin-bottom:8px;
  }
  @keyframes shineText{
    0%{background-position:0% 50%}
    100%{background-position:200% 50%}
  }
  .logo-area p{
    color:var(--text-dim);
    font-size:0.95rem;
  }
  
  /* النموذج */
  .form-group{
    margin-bottom:20px;
    position:relative;
  }
  .form-group label{
    display:block;
    color:var(--gold);
    font-size:0.85rem;
    font-weight:700;
    margin-bottom:8px;
    padding-right:8px;
  }
  .form-group input{
    width:100%;
    padding:16px 50px 16px 18px;
    background:rgba(255,255,255,0.04);
    border:1px solid rgba(212,175,55,0.25);
    border-radius:15px;
    color:#fff;
    font-family:'Tajawal';
    font-size:1rem;
    transition:all 0.3s;
    outline:none;
  }
  .form-group input:focus{
    border-color:var(--gold);
    background:rgba(255,255,255,0.06);
    box-shadow:0 0 25px rgba(212,175,55,0.2);
  }
  .form-group input::placeholder{
    color:rgba(255,255,255,0.3);
  }
  .form-group .input-icon{
    position:absolute;
    left:18px;
    top:calc(50% + 10px);
    transform:translateY(-50%);
    font-size:1.2rem;
    pointer-events:none;
    opacity:0.6;
  }
  
  /* زر تسجيل الدخول */
  .btn-primary{
    width:100%;
    padding:16px;
    background:linear-gradient(135deg,var(--gold),var(--gold-light));
    color:#1a1a1a;
    border:none;
    border-radius:50px;
    font-family:'Tajawal';
    font-weight:900;
    font-size:1.05rem;
    cursor:pointer;
    transition:all 0.4s cubic-bezier(0.175,0.885,0.32,1.275);
    box-shadow:0 15px 40px rgba(212,175,55,0.4);
    position:relative;
    overflow:hidden;
    margin-top:10px;
  }
  .btn-primary::after{
    content:'';position:absolute;top:0;left:-100%;
    width:100%;height:100%;
    background:linear-gradient(90deg,transparent,rgba(255,255,255,0.5),transparent);
    transition:left 0.6s;
  }
  .btn-primary:hover::after{left:100%}
  .btn-primary:hover{
    transform:translateY(-3px) scale(1.02);
    box-shadow:0 20px 50px rgba(212,175,55,0.6);
  }
  .btn-primary:active{
    transform:translateY(-1px) scale(0.99);
  }
  
  /* زر Google */
  .btn-google{
    width:100%;
    padding:15px;
    background:#fff;
    color:#333;
    border:none;
    border-radius:50px;
    font-family:'Tajawal';
    font-weight:700;
    font-size:0.95rem;
    cursor:pointer;
    transition:all 0.3s;
    display:flex;
    align-items:center;
    justify-content:center;
    gap:12px;
    margin-top:15px;
    box-shadow:0 10px 30px rgba(255,255,255,0.1);
  }
  .btn-google:hover{
    transform:translateY(-2px);
    box-shadow:0 15px 40px rgba(255,255,255,0.2);
  }
  .btn-google svg{width:22px;height:22px}
  
  /* فاصل */
  .divider{
    display:flex;
    align-items:center;
    gap:15px;
    margin:25px 0;
    color:var(--text-dim);
    font-size:0.85rem;
  }
  .divider::before,
  .divider::after{
    content:'';
    flex:1;
    height:1px;
    background:linear-gradient(90deg,transparent,rgba(212,175,55,0.3),transparent);
  }
  
  /* رابط التخطي */
  .skip-link{
    display:block;
    text-align:center;
    color:var(--text-dim);
    text-decoration:none;
    font-size:0.9rem;
    margin-top:20px;
    transition:color 0.3s;
  }
  .skip-link:hover{
    color:var(--gold);
  }
  
  /* رسالة خطأ */
  .error-msg{
    color:var(--error);
    font-size:0.85rem;
    text-align:center;
    margin-top:12px;
    min-height:20px;
    font-weight:700;
  }
  
  /* ملاحظة Firebase */
  .note{
    text-align:center;
    color:var(--text-dim);
    font-size:0.8rem;
    margin-top:20px;
    padding:12px;
    background:rgba(139,92,246,0.1);
    border:1px solid rgba(139,92,246,0.3);
    border-radius:15px;
    line-height:1.6;
  }
  .note strong{color:var(--purple)}
</style>
</head>
<body>

<div class="aura-bg">
  <div class="aura aura-1"></div>
  <div class="aura aura-2"></div>
</div>

<div class="stars" id="stars"></div>

<div class="login-container">
  <div class="logo-area">
    <span class="logo-icon">🎓</span>
    <h1>توجيهي الأردن</h1>
    <p>منصة الطالب الذكية — سجّل دخولك للمتابعة</p>
  </div>
  
  <div class="form-group">
    <label>الاسم الكامل</label>
    <input type="text" id="userName" placeholder="مثال: أحمد محمد" autocomplete="name">
    <span class="input-icon">👤</span>
  </div>
  
  <div class="form-group">
    <label>الفرع الدراسي</label>
    <input type="text" id="userBranch" placeholder="مثال: علمي / أدبي / صناعي" autocomplete="off">
    <span class="input-icon">📚</span>
  </div>
  
  <button class="btn-primary" onclick="handleLogin()">
    ✨ تسجيل الدخول
  </button>
  
  <div class="divider">أو</div>
  
  <button class="btn-google" onclick="handleGoogleNote()">
    <svg viewBox="0 0 24 24">
      <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
      <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
      <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"/>
      <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/>
    </svg>
    تسجيل الدخول بحساب Google
  </button>
  
  <p class="error-msg" id="errorMsg"></p>
  
  <p class="note">
    <strong>ℹ️ ملاحظة:</strong> تسجيل Google الحقيقي سيُضاف قريباً.
    حالياً، أدخل اسمك للمتابعة.
  </p>
</div>

<script>
  // إنشاء نجوم
  const starsContainer = document.getElementById('stars');
  for (let i = 0; i < 50; i++) {
    const star = document.createElement('div');
    star.className = 'star';
    star.style.top = Math.random() * 100 + '%';
    star.style.left = Math.random() * 100 + '%';
    star.style.animationDelay = Math.random() * 3 + 's';
    star.style.animationDuration = (2 + Math.random() * 2) + 's';
    starsContainer.appendChild(star);
  }
  
  // التحقق من وجود جلسة سابقة
  window.addEventListener('load', () => {
    const user = localStorage.getItem('tawjihi_user');
    if (user) {
      try {
        const userData = JSON.parse(user);
        document.getElementById('userName').value = userData.name || '';
        document.getElementById('userBranch').value = userData.branch || '';
      } catch (e) {}
    }
  });
  
  // معالج تسجيل الدخول
  function handleLogin() {
    const name = document.getElementById('userName').value.trim();
    const branch = document.getElementById('userBranch').value.trim();
    const errorMsg = document.getElementById('errorMsg');
    
    errorMsg.textContent = '';
    
    if (!name) {
      errorMsg.textContent = '⚠️ الرجاء إدخال اسمك';
      return;
    }
    
    if (name.length < 2) {
      errorMsg.textContent = '⚠️ الاسم قصير جداً';
      return;
    }
    
    if (!branch) {
      errorMsg.textContent = '⚠️ الرجاء إدخال فرعك الدراسي';
      return;
    }
    
    // حفظ البيانات
    const userData = {
      name: name,
      branch: branch,
      loginTime: Date.now(),
      id: 'user_' + Math.random().toString(36).substr(2, 9)
    };
    
    localStorage.setItem('tawjihi_user', JSON.stringify(userData));
    
    // تحويل للصفحة الرئيسية
    errorMsg.style.color = '#22c55e';
    errorMsg.textContent = '✅ تم تسجيل الدخول! جارٍ التحويل...';
    
    setTimeout(() => {
      window.location.href = 'index.html';
    }, 800);
  }
  
  // زر Google
  function handleGoogleNote() {
    const errorMsg = document.getElementById('errorMsg');
    errorMsg.style.color = '#8b5cf6';
    errorMsg.textContent = '🚧 تسجيل Google قادم قريباً — استخدم النموذج أعلاه';
    
    setTimeout(() => {
      errorMsg.textContent = '';
    }, 3000);
  }
  
  // Enter للتبديل
  document.getElementById('userName').addEventListener('keypress', (e) => {
    if (e.key === 'Enter') document.getElementById('userBranch').focus();
  });
  document.getElementById('userBranch').addEventListener('keypress', (e) => {
    if (e.key === 'Enter') handleLogin();
  });
</script>

</body>
</html>
